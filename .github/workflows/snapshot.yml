name: snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  packages: write
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v5


      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset clang-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build (x64)
        run: .\scripts\build-games.ps1

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Prepare Release folder
        run: md githubrelease

      - name: Copy Schema
        run: copy renodx-metadata-schema.json githubrelease\

      - name: Copy selected game binaries and symbols
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $games = Get-Content games.json -Raw | ConvertFrom-Json
          foreach ($game in $games) {
            Copy-Item "build/Release/renodx-$game.addon64" githubrelease/
            Copy-Item "build/Release/renodx-$game.pdb" githubrelease/
            $updated = (Get-Item "build/Release/renodx-$game.addon64").LastWriteTimeUtc.ToString('yyyy-MM-dd HH:mm')
            $badge = '<svg xmlns="http://www.w3.org/2000/svg" width="220" height="20" role="img" aria-label="Built: ' + $updated + ' UTC"><title>Built: ' + $updated + ' UTC</title><rect width="220" height="20" rx="3" fill="#007ec6"/><g fill="#fff" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="11"><text x="110" y="14">' + $updated + ' UTC</text></g></svg>'
            Set-Content "githubrelease/build-$game.svg" $badge -Encoding utf8
          }
      
      - name: Generate metadata manifest
        run: node scripts/generate-release-manifest.mjs

      - name: Build web UI
        run: node src/web/scripts/build.mjs


      - name: Put current date into a variable
        run: |
          $NOW=& Get-Date -format yyyyMMdd
          echo "NOW=$NOW" >> $env:GITHUB_ENV

      - name: Create a Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: snapshot
          title: RenoDX Snapshot Build
          files: githubrelease/*
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "githubrelease"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: windows-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
